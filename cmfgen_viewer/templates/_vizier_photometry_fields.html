{% macro vizier_photometry_fields(id_prefix, center, radius_arcsec, table_ids, catalog_options, selected_catalogs, all_catalogs) -%}
  <div class="row g-2 mb-2">
    <div class="col-sm-8">
      <label for="{{ id_prefix }}-center" class="form-label form-label-sm mb-1">Center (coordinates or object name)</label>
      <input
        id="{{ id_prefix }}-center"
        name="vizier_center"
        type="text"
        class="form-control form-control-sm"
        value="{{ center }}"
        placeholder="e.g. 10:12:45.3 +12:34:56.7 or HD 12345"
        required
      >
    </div>
    <div class="col-sm-4">
      <label for="{{ id_prefix }}-radius-arcsec" class="form-label form-label-sm mb-1">Radius (arcsec)</label>
      <input
        id="{{ id_prefix }}-radius-arcsec"
        name="vizier_radius_arcsec"
        type="number"
        min="0.01"
        max="3600"
        step="any"
        class="form-control form-control-sm"
        value="{{ radius_arcsec }}"
        placeholder="5"
      >
    </div>
  </div>
  <div class="mb-2">
    <label for="{{ id_prefix }}-table-ids" class="form-label form-label-sm mb-1">Extra VizieR table IDs (optional)</label>
    <input
      id="{{ id_prefix }}-table-ids"
      name="vizier_table_ids"
      type="text"
      class="form-control form-control-sm font-monospace"
      value="{{ table_ids }}"
      placeholder="e.g. II/122B/merged, J/ApJ/123/456/table1"
    >
  </div>
  <div class="d-flex flex-wrap align-items-center gap-3 mb-2">
    {% for item in catalog_options %}
      <div class="form-check form-check-inline me-0">
        <input
          id="{{ id_prefix }}-catalog-{{ item.key }}"
          name="vizier_catalog"
          type="checkbox"
          class="form-check-input"
          value="{{ item.key }}"
          {% if item.key in selected_catalogs %}checked{% endif %}
        >
        <label for="{{ id_prefix }}-catalog-{{ item.key }}" class="form-check-label small">{{ item.label }}</label>
      </div>
    {% endfor %}
  </div>
  <div class="form-check mb-3">
    <input
      id="{{ id_prefix }}-all-catalogs"
      name="vizier_all_catalogs"
      type="checkbox"
      class="form-check-input"
      value="1"
      {% if all_catalogs %}checked{% endif %}
    >
    <label for="{{ id_prefix }}-all-catalogs" class="form-check-label small">Query all available VizieR SED catalogs</label>
  </div>
{%- endmacro %}

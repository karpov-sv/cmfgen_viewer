  <div class="spectrum-zoom">
    <div class="spectrum-field flex-grow-1">
    <label for="{{ plot_id }}-lines-zoom" class="plot-control-label">Zoom to</label>
    <select id="{{ plot_id }}-lines-zoom" class="form-select form-select-sm" title="Line windows use the width beside this selector, centered on the redshifted line position in the displayed Air/Vacuum convention. Diagnostic windows use their exact uploaded-wavelength bounds. Vertical scale fits the displayed region.">
      <option value="" selected>Choose a range or line…</option>
      <optgroup label="Spectrum views">
        <option value="full">Whole spectrum</option>
        <option value="optical">Optical (3800–7500 Å)</option>
      </optgroup>
    </select>
    </div>
    <div class="spectrum-field spectrum-zoom-width">
      <label for="{{ plot_id }}-lines-zoom-width" class="plot-control-label">Width (Å)</label>
      <input id="{{ plot_id }}-lines-zoom-width" type="number" min="0.000001" step="any" value="300" placeholder="300" class="form-control form-control-sm" title="Total wavelength span for line jumps, centered on the selected line (300 Å means ±150 Å). Blank uses 300 Å. Diagnostic windows, Whole spectrum and Optical presets use their own bounds.">
    </div>
  </div>
  {% if show_axis_controls | default(true) %}
    {% include "_spectrum_axis_controls.html" %}
  {% endif %}
  <label class="form-check-label small spectrum-line-toggle" for="{{ plot_id }}-lines-show">
    <input id="{{ plot_id }}-lines-show" class="form-check-input me-1" type="checkbox"> Spectral lines
  </label>
  <label class="form-check-label small spectrum-line-toggle" for="{{ plot_id }}-telluric-show">
    <input id="{{ plot_id }}-telluric-show" class="form-check-input me-1" type="checkbox" title="Approximate atmospheric absorption bands, fixed in the upload's Air/Vacuum convention and independent of stellar redshift. Prior observatory-frame corrections are not inferred." aria-describedby="{{ plot_id }}-telluric-help"> Telluric bands
  </label>
  {% if plot_id == 'upload-spectrum-plot' and upload.observation_type != 'photometry' %}
    <label class="form-check-label small spectrum-line-toggle" for="{{ plot_id }}-diagnostic-show">
      <input id="{{ plot_id }}-diagnostic-show" class="form-check-input me-1" type="checkbox" checked title="Show faint amber bands for diagnostic windows entered in the form, at their fixed uploaded-wavelength bounds. Fit-range limits and exclusions still apply to scoring."> Diagnostic windows
    </label>
    <label class="form-check-label small spectrum-line-toggle" for="{{ plot_id }}-exclusions-show">
      <input id="{{ plot_id }}-exclusions-show" class="form-check-input me-1" type="checkbox" checked title="Show pale red bands for intervals removed from the fit. Bounds stay fixed in uploaded wavelengths; this display toggle does not change which samples are excluded."> Excluded intervals
    </label>
  {% endif %}
